# Hornwork：加固模块 TLS 加固端点 + 平台控制台反代
# - TLS 口径：Mozilla intermediate（保留 TLS 1.2 兼容旧浏览器；弱套件靠套件表与协议下限归零）
# - 平台控制台：登录认证由认证模块（三因子）提供，会话令牌经本 TLS 入口下发
# 本文件由 hornwork.harden.crypto.render_tls() 渲染生成，不要手工修改。
server {
    listen 127.0.0.1:8080;
    server_name a.hornwork.local;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name a.hornwork.local;

    ssl_certificate     @CERT@;
    ssl_certificate_key @KEY@;
    ssl_trusted_certificate @CA@;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_stapling off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    root /var/www/html;
    index index.html;

    # 根路径直接进入平台控制台
    location = / {
        return 302 /platform;
    }

    # 演示辅助（合成人脸向量与演示账号动态码）
    location ^~ /demo/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 平台控制台（检测模块 Web，仅回环监听）经 TLS 反代对外
    location = /platform {
        proxy_pass http://127.0.0.1:8787/platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 平台的只读 API 与登录接口（认证扫描模块因子登录在此入口完成）
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
    }

    location / {
        default_type text/plain;
        return 200 "hornwork-platform-tls-ok\n";
    }
}

