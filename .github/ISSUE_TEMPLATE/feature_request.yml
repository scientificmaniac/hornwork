name: 功能建议
description: 提出新能力、检测规则或改进建议
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出建议！请尽量说明使用场景与约束。涉及安全模型（权限、审批、默认模式）的
        改动请重点描述影响面。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 与文档，确认这不是已规划/已实现的能力
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到了什么困难？为什么现有能力不够？
      placeholder: 在……场景下，现有实现……，导致……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为、接口或规则形式；可给出命令/配置/规则示例。
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 相关组件
      options:
        - 采集层
        - 检测引擎与规则
        - 静态扫描与内存检测
        - 扫描与 CVE 匹配
        - 响应与审计链
        - 靶场编排与漏洞档案
        - 认证子系统
        - 加固编排
        - 验证框架
        - Web 控制台 / CLI
        - 文档与工程化
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，以及为什么放弃。

  - type: checkboxes
    id: impact
    attributes:
      label: 影响面
      options:
        - label: 会改变默认运行模式或响应动作（observe / dry-run / enforce）
        - label: 需要新增外部命令调用或新的系统权限
        - label: 需要新增第三方依赖
        - label: 只涉及文档/规则/内部重构

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考资料、上游实现、截图等。
