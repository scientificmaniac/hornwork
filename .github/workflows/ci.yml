name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 运行期 + 认证/加固 + 开发工具统一由 pyproject.toml 的 extras 声明，
          # 避免 CI 与本地维护两套重复依赖清单产生漂移。
          python -m pip install -e '.[auth,dev]'

      - name: Entrypoint smoke test
        # 验证 [project.scripts] 声明的 hornworkctl 在真实安装后可启动，
        # 这类问题只在 pip install 后暴露，源码目录直接跑单测覆盖不到。
        run: hornworkctl --version

      - name: Byte-compile package
        run: python -m compileall -q hornwork

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-py${{ matrix.python-version }}
          path: tests/_tmp
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[auth,dev]'

      - name: Byte-compile package
        run: python -m compileall -q hornwork

      - name: Validate workflow and issue-template YAML
        run: |
          # PyYAML 已随 -e .[auth,dev] 的运行期依赖装入，无需重复指定。
          python - <<'PY'
          import glob
          import sys

          import yaml

          files = sorted(glob.glob(".github/**/*.yml", recursive=True))
          if not files:
              sys.exit("no YAML files found under .github/")
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"ok: {path}")
          PY

      - name: Check required community files
        run: |
          for path in LICENSE NOTICE CONTRIBUTING.md SECURITY.md \
                      CODE_OF_CONDUCT.md CHANGELOG.md \
                      .gitignore .editorconfig .gitattributes; do
            test -s "$path" || { echo "missing or empty: $path" >&2; exit 1; }
          done
          for path in .github/workflows/ci.yml \
                      .github/PULL_REQUEST_TEMPLATE.md \
                      .github/dependabot.yml \
                      .github/ISSUE_TEMPLATE/bug_report.yml \
                      .github/ISSUE_TEMPLATE/feature_request.yml \
                      .github/ISSUE_TEMPLATE/config.yml; do
            test -s "$path" || { echo "missing or empty: $path" >&2; exit 1; }
          done
          echo "all required files present"

      - name: Ruff (lint gate)
        # 逻辑规则集与 ruff 版本均在 pyproject.toml 中固定（dev extra），
        # 由上方的 Install dependencies 步骤装入，避免两处版本声明漂移。
        run: ruff check hornwork tests

  frontend:
    name: frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload bundle size report
        working-directory: frontend
        run: |
          ls -lh dist/assets | head -20
          du -sh dist
