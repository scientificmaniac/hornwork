fix:
  patch_version: 升级发行版 redis 包：Debian DSA-5081 / Ubuntu USN-5270-1（以发行版公告为准）
  config_mitigation:
  - 禁止 Redis 暴露到网络：只绑定 127.0.0.1，防火墙仅放行必要来源
  - 启用 requirepass 并禁用/重命名危险命令（rename-command EVAL ""）
  - 以非 root 用户运行 Redis，缩小命令执行后的影响面
  detection_rule: 检测模块 H-0001/N-0101（异常请求/流量：非业务 EVAL 与 Lua 动态库加载）
