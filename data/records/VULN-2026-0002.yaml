fix:
  patch_version: 升级到 3.0.7 或 3.1.1（受影响区间 <3.0.7 与 3.1.0）
  config_mitigation:
  - 关闭或对 Actuator gateway 端点做鉴权（management.endpoints.web.exposure.include 收敛）
  - 网关仅绑定回环/内网并限制来源 IP，禁止公网暴露 8080 端口
  - 升级前对 /actuator/gateway/** 做请求体 WAF 拦截（含 T( 与 Runtime 关键字）
  detection_rule: 检测模块 H-0001/N-0101（异常请求/流量：Actuator 路由写入与 refresh 调用）
