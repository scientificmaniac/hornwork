fix:
  patch_version: 升级到 8.0.7 / 8.1.8 / 8.2.7 / 8.3.1（按所在次版本线升级，8.3.1 为 8.3.x 修复版）
  config_mitigation:
  - Grafana 仅绑定回环/内网并限制来源 IP，禁止公网暴露 3000 端口
  - 反向代理层做路径归一化，拒绝含 ../ 的请求
  - 禁用未使用的插件静态资源路由（或移除 alertlist 等默认插件）
  detection_rule: 检测模块 H-0001/N-0101（异常请求/流量：路径穿越序列与敏感文件读取）
