# Hornwork clamd 关键参数片段
# 用法：由 scripts/setup.sh 追加到 /etc/clamav/clamd.conf（重复安装会先移除旧片段），
#       追加后重启 clamav-daemon；hornwork 进程通过该 LocalSocket 走 INSTREAM 扫描。

LocalSocket /var/run/clamav/clamd.ctl
LocalSocketGroup clamav
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
MaxThreads 4
ReadTimeout 60
